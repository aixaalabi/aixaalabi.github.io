
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hi, I'm Aixa</title>

<link rel="icon" type="image/x-icon" href="./a.ico">
<link rel="stylesheet" href="./src/style/main.css">
</head>

<body>

<!-- NAVIGATION -->

<nav id="navigation">
  <div class="nav-item" data-index="0">
    <span class="dot"></span>About
  </div>
  <div class="nav-item active" data-index="1">
    <span class="dot"></span>Welcome
  </div>
  <div class="nav-item" data-index="2">
    <span class="dot"></span>Project 1
  </div>
  <div class="nav-item" data-index="3">
    <span class="dot"></span>Project 2
  </div>
  <div class="nav-item" data-index="4">
    <span class="dot"></span>Project 3
  </div>
  <div class="last-nav nav-item" data-index="5">
    <span class="dot"></span>Misc
  </div>
</nav>

<!-- ARROWS -->

<button class="arrow left" id="prev" aria-label="Previous slide">
  <svg viewBox="0 0 20 30">
    <path d="M17 2 L3 15 L17 28 Z" fill="currentColor"/>
  </svg>
</button>

<button class="arrow right" id="next" aria-label="Next slide">
  <svg viewBox="0 0 20 30">
    <path d="M3 2 L17 15 L3 28 Z" fill="currentColor"/>
  </svg>
</button>

<!-- CAROUSEL -->

<main class="carousel">
  <div class="track" id="track">

    <section class="slide" id="leftSlide"></section>
    <section class="slide" id="currentSlide"></section>
    <section class="slide" id="rightSlide"></section>

  </div>
</main>

<div id="slide-templates" hidden>

  <template id="template-about">
    <div class="slide-content">
      <h1>About</h1>
      <p>A little introduction about the work, the ideas and the person behind it.</p>
      <div class="svg-placeholder">SVG / IMAGE</div>
    </div>
  </template>

  <template id="template-welcome">
    <div class="aixa-slide">
      <div class="aixa-profile">
        <div class="aixa-portrait">
          <img src="./assets/profile.svg" alt="Aixa Alabi">
        </div>

        <div class="aixa-intro">
          <div class="aixa-name">
            <span class="aixa-hi">I am</span>
            <span class="aixa-logo"><img src="./assets/logo.svg" alt=""></span>
          </div>

          <div class="aixa-subtitle">
            and I design digital experiences through curiosity, empathy, and creativity.
          </div>
        </div>
      </div>

      <div class="aixa-bottom">
        <div class="aixa-characteristics">
          <div>
            <div class="aixa-number">01</div>
            <div class="aixa-heading">UX Designer</div>
            <div class="aixa-description">Creating intuitive, human-centered digital experiences.</div>
          </div>

          <div>
            <div class="aixa-number">02</div>
            <div class="aixa-heading">Storyteller</div>
            <div class="aixa-description">Turning user insights into compelling product narratives.</div>
          </div>

          <div>
            <div class="aixa-number">03</div>
            <div class="aixa-heading">Creative Problem Solver</div>
            <div class="aixa-description">Combining research, prototyping and design thinking.</div>
          </div>
        </div>

        <div class="aixa-tools">
          <span>TOOLS</span>
          <span>Figma</span>
          <span>Affinity</span>
          <span>Adobe Suite</span>
          <span>Procreate</span>
        </div>

        <div class="aixa-links">
          <a href="YOUR-LINKEDIN-URL">LinkedIn ↗</a>
          <a href="mailto:YOUR-EMAIL">Email ↗</a>
          <a href="YOUR-FIGMA-URL">Figma ↗</a>
          <a href="YOUR-GITHUB-URL">GitHub ↗</a>
          <a href="YOUR-BEHANCE-URL">Behance ↗</a>
          <a href="YOUR-MEDIUM-URL">Medium ↗</a>
          <a href="YOUR-PORTFOLIO-URL.pdf">CV ↓</a>
        </div>
      </div>
    </div>
  </template>

  <template id="template-project-1">
    <div class="scrolly-story">

      <div class="scrolly-visual" data-state="0">

        <div class="scrolly-background"></div>

        <svg viewBox="0 0 600 400"
             class="scrolly-svg"
             xmlns="http://www.w3.org/2000/svg">

          <circle class="story-circle circle-1"
                  cx="300" cy="200" r="65"/>

          <circle class="story-circle circle-2"
                  cx="300" cy="200" r="65"/>

          <circle class="story-circle circle-3"
                  cx="300" cy="200" r="65"/>

        </svg>

        <h1 class="scrolly-title">Project 1</h1>

      </div>

      <div class="scrolly-steps">

        <div class="scrolly-step" data-state="0">
          <div class="step-content">
            <h2>01 — Beginning</h2>
            <p>The first stage of the project. An introduction to the visual concept.</p>
          </div>
        </div>

        <div class="scrolly-step" data-state="1">
          <div class="step-content">
            <h2>02 — Transformation</h2>
            <p>As we scroll, the visual language starts to change.</p>
          </div>
        </div>

        <div class="scrolly-step" data-state="2">
          <div class="step-content">
            <h2>03 — Resolution</h2>
            <p>The final stage reveals a new color and shape.</p>
          </div>
        </div>

      </div>

    </div>
    
  </template>

  <template id="template-project-2">
      <div class="split-story">

        <div class="split-visual">

          <svg class="split-layer layer-1" viewBox="0 0 1000 600" preserveAspectRatio="none">
            <rect width="1000" height="600" fill="#dcd2f0"/>
            <circle cx="500" cy="300" r="100" fill="#f27e68"/>
          </svg>

          <svg class="split-layer layer-2" viewBox="0 0 1000 600" preserveAspectRatio="none">
            <rect width="1000" height="600" fill="#f1e3aa"/>
            <rect x="350" y="200" width="300" height="200" fill="#5277d9"/>
          </svg>

          <svg class="split-layer layer-3" viewBox="0 0 1000 600" preserveAspectRatio="none">
            <rect width="1000" height="600" fill="#b9dfcb"/>
            <polygon points="500,150 650,450 350,450" fill="#8055b9"/>
          </svg>

        </div>

        <div class="split-steps">
          <div class="split-step"></div>
          <div class="split-step"></div>
          <div class="split-step"></div>
        </div>

      </div>
    
    
  </template>

  <template id="template-project-3">
    
      <div class="motion-story">

        <div class="motion-visual">

          <svg viewBox="0 0 1000 600"
              class="motion-svg"
              preserveAspectRatio="xMidYMid meet">

            <circle class="motion-circle circle-1"
                    cx="100" cy="200" r="45"
                    fill="#f27e68"/>

            <circle class="motion-circle circle-2"
                    cx="100" cy="300" r="45"
                    fill="#5277d9"/>

            <circle class="motion-circle circle-3"
                    cx="100" cy="400" r="45"
                    fill="#8055b9"/>

          </svg>

        </div>

        <div class="motion-steps">
          <div class="motion-step"></div>
          <div class="motion-step"></div>
        </div>

      </div>
    
    
  </template>

  <template id="template-misc">

      <div class="zoom-story">

        <div class="zoom-visual">

          <svg class="zoom-svg"
              viewBox="0 0 1000 600"
              preserveAspectRatio="xMidYMid meet">

            <g class="zoom-world">

              <!-- Main rectangle -->
              <rect x="400" y="250"
                    width="200" height="100"
                    fill="#5277d9"
                    stroke="#ffffff"
                    stroke-width="3"/>

              <!-- Circles inside the rectangle -->
              <circle cx="430" cy="280" r="8"
                      fill="#f27e68"/>

              <circle cx="480" cy="300" r="8"
                      fill="#f1e3aa"/>

              <circle cx="530" cy="275" r="8"
                      fill="#8055b9"/>

              <circle cx="570" cy="325" r="8"
                      fill="#b9dfcb"/>

              <circle cx="450" cy="330" r="8"
                      fill="#ffffff"/>

              <circle cx="550" cy="300" r="8"
                      fill="#f27e68"/>

            </g>

          </svg>

        </div>

        <div class="zoom-steps">
          <div class="zoom-step"></div>
          <div class="zoom-step"></div>
          <div class="zoom-step"></div>
        </div>

      </div>
    
  </template>

</div>

<script type="module" src="./src/logic/main.js"></script>
</body>
</html>
